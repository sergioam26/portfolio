<section id="about" class="min-vh-100 d-flex align-items-center py-5">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-8">
        <span class="badge status-pill px-3 py-2 rounded-pill mb-3 fs-6 fw-normal">
          <i class="bi bi-circle-fill me-1" style="font-size: 0.6rem;"></i> {{ i18n.t().hero.status }}
        </span>

        <h1 class="display-4 fw-bold text-light mb-1">{{ i18n.t().hero.title }}</h1>
        <h2 class="fs-4 mb-4" style="color: #38bdf8;">{{ i18n.t().hero.role }}</h2>

        <p class="lead text-light opacity-75 mb-4" style="line-height: 1.7;" [innerHTML]="i18n.t().hero.desc"></p>

        <div class="d-flex gap-3">
          <a href="#projects" class="btn btn-tech px-4 py-2">
            {{ i18n.t().hero.btnProjects }} <i class="bi bi-arrow-right ms-1"></i>
          </a>
          <a href="#experience" class="btn btn-outline-light px-4 py-2">
            {{ i18n.t().hero.btnExperience }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
