<section id="experience" class="py-5">
  <div class="container">
    <div class="mb-5">
      <h2 class="display-6 fw-bold text-light">{{ i18n.t().experience.title }}</h2>
    </div>

    <div class="row">
      <div class="col-lg-10">
        <div class="tech-card p-4">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3">
            <div>
              <h3 class="h4 fw-bold text-light mb-1">{{ i18n.t().experience.role }}</h3>
              <h4 class="h6 text-secondary mb-0">{{ i18n.t().experience.company }}</h4>
            </div>
            <span class="badge bg-secondary bg-opacity-25 text-light border border-secondary border-opacity-25 mt-2 mt-md-0 align-self-start align-self-md-center">
              {{ i18n.t().experience.period }}
            </span>
          </div>

          <ul class="text-light opacity-75 mb-4">
            <li class="mb-2" [innerHTML]="i18n.t().experience.bullet1"></li>
            <li class="mb-2" [innerHTML]="i18n.t().experience.bullet2"></li>
            <li class="mb-2" [innerHTML]="i18n.t().experience.bullet3"></li>
            <li [innerHTML]="i18n.t().experience.bullet4"></li>
          </ul>

          <div class="d-flex flex-wrap gap-2">
            <span class="badge bg-dark text-info border border-secondary">Java</span>
            <span class="badge bg-dark text-info border border-secondary">Spring Boot</span>
            <span class="badge bg-dark text-info border border-secondary">Angular</span>
            <span class="badge bg-dark text-info border border-secondary">PostgreSQL</span>
            <span class="badge bg-dark text-info border border-secondary">MySQL</span>
            <span class="badge bg-dark text-info border border-secondary">Git</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
